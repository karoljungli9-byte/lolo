 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #202638;
        }

        @media (max-width: 768px) {
            .container {
                width: 92%;
            }

            .hero-title {
                font-size: 32px !important;
                line-height: 1.1;
            }

            .hero {
                text-align: center;
            }

            .hero-image {
                margin-top: 30px;
            }

            .technology {
                flex-direction: column;
            }

            .technology img {
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr 1fr !important;
            }

            .support {
                flex-direction: column;
            }

            .price-info {
                grid-template-columns: 1fr !important;
            }

            .table-wrapper {
                overflow-x: auto;
            }

            .footer {
                text-align: center;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 27px !important;
            }

            .cards {
                grid-template-columns: 1fr !important;
            }

            .technology {
                padding: 20px !important;
            }

            .price-table {
                font-size: 12px;
            }

            .price-table th,
            .price-table td {
                padding: 10px 7px !important;
            }
        }
    </style>
</head>

<body>
<header class="bg-white">
    <div class="container mx-auto max-w-6xl px-5 py-5 flex items-center justify-between">

        <div class="text-2xl font-bold">
            <span class="text-cyan-500">Yt</span>
            <span class="text-orange-500">Y</span>
            <span class="text-cyan-500">t</span>
        </div>

        <nav class="hidden md:flex gap-8 text-sm text-gray-600">
            <a href="#">Чему вы научитесь</a>
            <a href="#">Процесс обучения</a>
            <a href="#">Стоимость</a>
            <a href="#">Контакты</a>
        </nav>

        <div class="flex gap-3">
            <button class="hidden sm:block px-5 py-2 rounded-full text-sm text-gray-600">
                Регистрация
            </button>

            <button class="bg-sky-400 text-white px-5 py-2 rounded-full text-sm">
                Войти
            </button>
        </div>
    </div>
</header>







</body>
</html>
